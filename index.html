<!DOCTYPE html>
<!-- FreeCell using Div a NotoSans2 for the cards -->
<html lang=en>
<head>
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta name="google" content="notranslate">
  <link rel='shortcut icon' href='/back.png'>
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="theme-color" content="green"/>
  <meta name="description" content="One-Click FreeCell Game by John Coonrod"/>
	<title>One-click Freecell</title>
  <link rel="stylesheet" href="style.css">
  <script src="/confetti.browser.min.js"></script>
  <script src="freecell.js" defer></script>
</head>
  
<body tabindex="-1">
<div class="dropdown">
  <button class="dropbtn">Freecell</button>
  <div class="dropdown-content">
    <a href="/">Freecell</a>
    <a href="/classic">Classic</a>
    <a href="/pyramid">Pyramid</a>
    <a href="/spider">Spider</a>
  </div>
</div>
<div class="buttons">
  <button class="dropbtn" onclick="shuffle(); deal()">New Game</button>
  <button class="dropbtn" onclick="deal()">Replay</button>
  <button class="dropbtn" onclick="undo()">Undo</button>
</div>
<!-- Freecells are red and Foundations are Blue--> 
<div class=row>
  <div id=s0 class="card redborder" onclick="dropFree(0)"></div>
  <div id=s1 class="card redborder" onclick="dropFree(1)"></div>
  <div id=s2 class="card redborder" onclick="dropFree(2)"></div>
  <div id=s3 class="card redborder" onclick="dropFree(3)"></div>
  <div id=a0 class="card blueborder"></div>
  <div id=a1 class="card blueborder"></div>
  <div id=a2 class="card blueborder"></div>
  <div id=a3 class="card blueborder"></div>
</div>
<div class=row>&nbsp;</div>
<!-- Unlike other games, we click on columns not the cards-->
<div class=row>
  <div id=c0 class=c onclick="popStack(0)"></div>
  <div id=c1 class=c onclick="popStack(1)"></div>
  <div id=c2 class=c onclick="popStack(2)"></div>
  <div id=c3 class=c onclick="popStack(3)"></div>
  <div id=c4 class=c onclick="popStack(4)"></div>
  <div id=c5 class=c onclick="popStack(5)"></div>
  <div id=c6 class=c onclick="popStack(6)"></div>
  <div id=c7 class=c onclick="popStack(7)"></div>
</div>
</body>
</html>
