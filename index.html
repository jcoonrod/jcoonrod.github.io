<!DOCTYPE html>
<!-- F2 - freecell based on classic -->
<html lang=en>
<head>
<!--  <link rel="manifest" href="manifest.json"> -->
	<meta name="google" content="notranslate">
 	<link rel="canonical" href="https://jcoonrod.github.io" />
  <link rel='shortcut icon' href='/back.png'>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="theme-color" content="green"/>
  <meta name="description" content="One-click Freecell by John Coonrod"/>
	<title>Freecell</title>
	<link rel="stylesheet" href="style.css">
  <script src="confetti.browser.min.js"></script>
  <script src="common.js"></script>
  <script src="freecell.js" defer></script>
</head>
  
<body tabindex="-1">
<div class="dropdown">
  <button class="dropbtn">Freecell v</button>
  <div class="dropdown-content">
    <a href="/classic">Classic</a>
    <a href="/">Freecell</a>
    <a href="/spider">Spider</a>
  </div>
</div>
<div class="buttons">
  <button class="dropbtn" onclick="shuffle(); clearBoard(); deal();">New</button>
	<button class="dropbtn" onclick="clearBoard();deal();">Replay</button>
</div>
<!--First row is the reserve (r0) dealt from reserve (s0-2) and foundation piles (a0-3)-->
<div class=row>
  <div id=s0 class="card blueborder" onclick="tryDrop(this);"></div>
  <div id=s1 class="card blueborder" onclick="tryDrop(this);"></div>
  <div id=s2 class="card blueborder" onclick="tryDrop(this);"></div>
  <div id=s3 class="card blueborder" onclick="tryDrop(this);"></div>
  <div id=a0 class="card redborder"></div>
  <div id=a1 class="card redborder"></div>
  <div id=a2 class="card redborder"></div>
  <div id=a3 class="card redborder"></div>
</div>
<!-- make sure the blank row has some space-->
<div class="row">&nbsp;</div>
<div class=row>
  <div id=c0 class=c></div>
  <div id=c1 class=c></div>
  <div id=c2 class=c></div>
  <div id=c3 class=c></div>
  <div id=c4 class=c></div>
  <div id=c5 class=c></div>
  <div id=c6 class=c></div>
  <div id=c7 class=c></div>
</div>
</body>
</html>
