<!DOCTYPE html>
<!-- Classic Solitaire using div for the cards - not a pwa for now -->
<html lang=en>
<head>
<!--  <link rel="manifest" href="manifest.json"> -->
	<meta name="google" content="notranslate">
 	<link rel="canonical" href="https://jcoonrod.github.io/classic" />
  	<link rel='shortcut icon' href='/back.png'>
  	<meta charset="utf-8">
  	<meta name="viewport" content="width=device-width">
  	<meta name="description" content="Classic Solitaire Game by John Coonrod"/>
	<title>Classic Solitaire</title>
	<link rel="stylesheet" href="/style.css">
  <script src="/confetti.browser.min.js"></script>
  <script src="/impure.js"></script>
  <script src="classic.js" defer></script>
</head>
  
<body>
<div class="dropdown">
  <button class="dropbtn">Classic</button>
  <div class="dropdown-content">
    <a href="/classic">Classic</a>
    <a href="/">Freecell</a>
    <a href="/spider">Spider</a>
  </div>
</div>
<div class="buttons">
  <button class="dropbtn" onclick="location.reload();">New</button>
	<button class="dropbtn" onclick="clearBoard();deal();">Replay</button>
  <span id=res> 24</span>
</div>
<!--First row is the reserve (r0) dealt from reserve (s0-2) and foundation piles (a0-3)-->
<div class=row>
  <div id=r0 class=cell onclick="next3();"></div> 
  <div id=s0 class=cell></div>
  <div id=s1 class=cell></div>
  <div id=s2 class=cell></div>
  <div id=a0 class=cell></div>
  <div id=a1 class=cell></div>
  <div id=a2 class=cell></div>
  <div id=a3 class=cell></div>
</div>
<!-- make sure the blank row has some space-->
<div class=row><p>&nbsp;</p></div>

<div class=row>
  <div id=c0 class=c></div>
  <div id=c1 class=c></div>
  <div id=c2 class=c></div>
  <div id=c3 class=c></div>
  <div id=c4 class=c></div>
  <div id=c5 class=c></div>
  <div id=c6 class=c></div>
</div>
</body>
</html>
