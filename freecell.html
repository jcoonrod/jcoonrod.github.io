<!DOCTYPE html>
<!-- FreeCell using svg for the cards - all in one HTML page -->
<html lang=en>
<head>
	<link rel="canonical" href="https://jcoonrod.github.io" />
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta name="google" content="notranslate">
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
  <link rel='shortcut icon' href='back.png'>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
	<title>1-Click Freecell</title>
	<link rel="stylesheet" href="style.css">
  <script src="confetti.browser.min.js"></script>
  <script src="common.js"></script>
  <script src="f3.js" defer></script>

</head>
  
<body tabindex="-1">
  <p>One-Click FreeCell 2;
  <button onclick="shuffle(); deal()">New Game</button>
  <button onclick="deal()">Replay</button>
  <button onclick="undo()">Undo</button>
  </p>
<div class=row>
  <div id=s0 class="card blueborder" onclick="dropFree(0);"></div>
  <div id=s1 class="card blueborder" onclick="dropFree(1);"></div>
  <div id=s2 class="card blueborder" onclick="dropFree(2);"></div>
  <div id=s3 class="card blueborder" onclick="dropFree(3);"></div>
  <div id=a0 class="card redborder"></div>
  <div id=a1 class="card redborder"></div>
  <div id=a2 class="card redborder"></div>
  <div id=a3 class="card redborder"></div>
</div>
<div class="row">&nbsp;</div>
<div class=row>
  <div id=c0 class=c onclick="popStack(0)"></div>
  <div id=c1 class=c onclick="popStack(1)"></div>
  <div id=c2 class=c onclick="popStack(2)"></div>
  <div id=c3 class=c onclick="popStack(3)"></div>
  <div id=c4 class=c onclick="popStack(4)"></div>
  <div id=c5 class=c onclick="popStack(5)"></div>
  <div id=c6 class=c onclick="popStack(6)"></div>
  <div id=c7 class=c onclick="popStack(7)"></div>
</body>
</html>
