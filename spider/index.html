<!DOCTYPE html>
<!-- One-click Spider Solitaire using div for the cards - all in one HTML page - not a pwa -->
<html lang=en>
<head>
<!--  <link rel="manifest" href="manifest.json"> -->
	<meta name="google" content="notranslate">
 	<link rel="canonical" href="https://jcoonrod.github.io/spider" />
  	<link rel='shortcut icon' href='/back.png'>
  	<meta charset="utf-8">
  	<meta name="viewport" content="width=device-width">
  	<meta name="theme-color" content="green"/>
  	<meta name="description" content="Spider Solitaire Game by John Coonrod"/>
	<title>Spider</title>
	<link rel="stylesheet" href="/f2.css">
  <script src="spider.js" defer></script>
</head>
  
<body tabindex="-1">
<div class="dropdown">
  <button class="dropbtn">Spider v</button>
  <div class="dropdown-content">
    <a href="/classic">Classic</a>
    <a href="/">Freecell</a>
    <a href="/spider">Spider</a>
  </div>
</div>
<div class="buttons">
  <button class="dropbtn" onclick="shuffle(); clearBoard(); deal();">New</button>
	<button class="dropbtn" onclick="clearBoard();deal();">Replay</button>
  <button class="dropbtn" id=suitlist onclick="changeSuits()"></button>
  <span id="sofar">      </span>
</div>

<div class=row>
  <div id=s0 class="card blueborder" onclick="if(ndealt==0){shuffle();deal();}else{next10();}"></div> 
  <div id=s1 class="x"></div>
  <div id=f0 class="card blueborder"></div>
  <div id=f1 class="card blueborder"></div>
  <div id=f2 class="card blueborder"></div>
  <div id=f3 class="card blueborder"></div>
  <div id=f4 class="card blueborder"></div>
  <div id=f5 class="card blueborder"></div>
  <div id=f6 class="card blueborder"></div>
  <div id=f7 class="card blueborder"></div>
</div>
<div class=row>&nbsp;</div>

<div class=row>
  <div id=c0 class=c10></div>
  <div id=c1 class=c10></div>
  <div id=c2 class=c10></div>
  <div id=c3 class=c10></div>
  <div id=c4 class=c10></div>
  <div id=c5 class=c10></div>
  <div id=c6 class=c10></div>
  <div id=c7 class=c10></div>
  <div id=c8 class=c10></div>
  <div id=c9 class=c10></div>
</div>
</body>
</html>
